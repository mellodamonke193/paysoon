# Deploy with: fly launch --no-deploy && fly volumes create paysoon_data --size 1 && fly deploy
# Secrets:     fly secrets set SECRET_KEY=... RESEND_API_KEY=... EMAIL_FROM=... STRIPE_SECRET_KEY=... \
#              STRIPE_WEBHOOK_SECRET=... STRIPE_PRICE_PRO=... ADMIN_EMAIL=... COMPANY_NAME=... \
#              COMPANY_ADDRESS=... GOVERNING_LAW=... SUPPORT_EMAIL=...
app = "paysoon"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_PATH = "/data/paysoon.db"
  TRUST_PROXY = "1"
  APP_URL = "https://paysoon.fly.dev"

[[mounts]]
  source = "paysoon_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # The reminder worker runs inside the app, so keep exactly one machine always on.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
